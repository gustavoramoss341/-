            if (!nome) {

                return;

            botao.disabled = true;

                        method: "POST",
                        headers: {

                        },
                        body: JSON.stringify({
                            pagina: "identificacao",
                            nome: nome
                        })
                    }
                );

                if (!resposta.ok) {
                    throw new Error("Não foi possível registrar a entrada.");
                }

                window.location.href = "index.html";

            } catch (erro) {
                console.error(erro);
                mensagem.textContent =
                    "Não consegui registrar sua entrada. Tente novamente.";
                botao.disabled = false;
            }
        });
    </script>
